name: Backend checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: bob
          POSTGRES_PASSWORD: bob
          POSTGRES_DB: bob_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U bob -d bob_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      TEST_DATABASE_URL: postgresql+psycopg://bob:bob@localhost:5432/bob_test
      DATABASE_URL: postgresql+psycopg://bob:bob@localhost:5432/bob_migrations
      LABLUP_API_KEY: ""
      GOOGLE_APPLICATION_CREDENTIALS: ""
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.lock
      - name: Install locked dependencies
        run: python -m pip install -r requirements.lock
      - name: Lint
        run: python -m ruff check .
      - name: Test against PostgreSQL
        run: python -m pytest
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Verify local question storage adapter
        run: node --test clients/local-question-store.test.mjs
      - name: Verify migration round trip
        run: |
          python -c "import psycopg; c = psycopg.connect('host=localhost user=bob password=bob dbname=bob_test', autocommit=True); c.execute('CREATE DATABASE bob_migrations'); c.close()"
          python -m alembic upgrade head
          python -m alembic downgrade base
          python -m alembic upgrade head
          python -m alembic check
      - name: Validate Compose configuration
        run: docker compose config --quiet
